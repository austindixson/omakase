# Omakase Raycast preset — section B (FM-OMAKASE-1)
#
# First-party contract. Super = Command.
# Not a Raycast .rayconfig: those are encrypted, passphrase-bound, and
# the on-disk shape has already changed once. Do not reverse-engineer one.
#
# Apply with the checklist in README.md in this folder.
# AeroSpace must not bind these chords (see config/aerospace/aerospace.toml).

name = "omakase-raycast"
section = "B"
super = "command"

# [mac-mapped] Super+Space — launcher
[launcher]
chord = "Super+Space"
hotkey = "cmd-space"
opens = "Raycast"
spotlight = "disable"

# [mac-mapped] Super+Return — Terminal
# Ghostty is primary (themes already paint it). Terminal.app if Ghostty is absent.
[terminal]
chord = "Super+Return"
hotkey = "cmd-enter"
app = "Ghostty"
fallback = "Terminal"

# [mac-mapped] Super+Shift+Return — Browser
[browser]
chord = "Super+Shift+Return"
hotkey = "cmd-shift-enter"
app = "default-browser"
stock_mac = "Safari"

# [mac-mapped] Super+Shift+F — Files
[files]
chord = "Super+Shift+F"
hotkey = "cmd-shift-f"
app = "Finder"

# [mac-mapped] Super+Shift+N — Editor
# TextEdit is on every Mac. Point this at Cursor / VS Code / Zed / Nova if you write there.
[editor]
chord = "Super+Shift+N"
hotkey = "cmd-shift-n"
app = "TextEdit"
overridable = true

# [mac-mapped] Super+Shift+M — Music
[music]
chord = "Super+Shift+M"
hotkey = "cmd-shift-m"
app = "Music"

# [mac-mapped] Super+Shift+/ — Passwords
# Skip this row if 1Password is not installed. Do not substitute a marketplace extension.
[passwords]
chord = "Super+Shift+/"
hotkey = "cmd-shift-slash"
app = "1Password"
if_missing = "skip"

# [mac-mapped] Super+Escape — system commands
# Raycast built-in System Actions. No power-menu UI. No marketplace.
# Super+Space, then type lock / sleep / restart.
# Optional one-shot: bind Super+Escape to Lock Screen.
[system]
chord = "Super+Escape"
hotkey = "cmd-esc"
via = "raycast-system-actions"
commands = ["Lock Screen", "Sleep", "Restart"]
one_shot = "Lock Screen"

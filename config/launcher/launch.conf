# Omakase launcher overrides. Optional.
#
# Copy to ~/.config/omakase/launch.conf after the cold-Mac install.
# Without this file the daily chords use stock Mac apps.

# Super+Shift+N. TextEdit is on every Mac. Point this at Cursor / VS Code / Zed / Nova.
# editor=TextEdit

# Super+Shift+Return. Safari is the stock Mac browser.
# browser=Safari

# Omakase local-agent override. Optional.
#
# Copy to ~/.config/omakase/agents.conf after the cold-Mac install.
# Without this file the scripts detect what is already here:
#   Cursor.app, then Cursor Agent CLI, then aider / claude / codex / copilot.
#
# Do not list cloud marketplaces. Do not put install URLs here.

# Primary id for Super+Ctrl+Return. Must match a detected or extra row.
# primary=cursor

# Working directory for CLI launches (Ghostty / Terminal).
# cwd=~

# Extra local agents you already run. Kind is app or cli.
# extra=id|label|kind|target
# extra=work-aider|Aider Work|cli|aider
# extra=cursor-cli|Cursor Agent CLI|cli|/Users/you/.local/bin/agent

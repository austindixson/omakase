# Omakase Super map — AeroSpace (FM-OMAKASE-1)
#
# Super = Command (cmd). Same muscle memory as Omarchy / Hyprland.
# SIP stays on. This file is the window-manager half of the Super map.
#
# Section A (Navigate) is live. Section B daily launches and Super+Space
# are live via exec-and-forget → bin/omakase-launch. Section C agent +
# lock + theme pick are live via exec-and-forget. Status tags match
# docs/bind-parity.md:
#
#   [mac-mapped]  intended for v0 (section A daily)
#   [deferred]    Hyprland-only layouts, Super clipboard, nested app chords
#
# Drop at: ~/.config/aerospace/aerospace.toml
# Reload:  aerospace reload-config   (or AeroSpace menu extra → Reload config)
# Docs:    https://nikitabobko.github.io/AeroSpace/guide
# Commands:https://nikitabobko.github.io/AeroSpace/commands
#
# Launcher: Super+Space + daily app launches → bin/omakase-launch
# Agents: Super+Shift+Ctrl+A / Super+Ctrl+Return → bin/omakase-agent
# Lock: Super+Ctrl+L → bin/omakase-lock
# Theme pick is Super+Ctrl+Shift+Space → bin/omakase-theme cycle.
# Do not bind clipboard chords here.

config-version = 2
start-at-login = true

# borders + sketchybar detect an already-running process; safe on reload.
# https://nikitabobko.github.io/AeroSpace/goodies
after-startup-command = [
    'exec-and-forget borders',
    'exec-and-forget sketchybar',
]

# Workspace pills on SketchyBar. Does not change section A bind commands.
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Persistent Omarchy-style numbered workspaces plus a scratch workspace.
# 'scratch' is the Mac stand-in for Hyprland special:scratchpad.
persistent-workspaces = ['1', '2', '3', '4', 'scratch']

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = false
key-mapping.preset = 'qwerty'

# Chrome for the themed bar + JankyBorders. Not per-theme (one gap set).
# Top 40 clears the 32px SketchyBar; inner 8 sits next to 5px borders.
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 8
gaps.outer.top = 40
gaps.outer.right = 8

# Native Apple apps stay Mac apps: float so they keep opening natively.
# Current AeroSpace syntax: if = 'test …' (legacy if.app-* is deprecated).
on-window-detected = [
    { if = 'test %{app-bundle-id} = com.apple.FinalCut', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.logic10', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.Photos', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.QuickTimePlayerX', run = 'layout floating' },
]

# mode.main.binding is the Super map. Section A chords are live.
[mode.main.binding]

    # -------------------------------------------------------------------------
    # A — Navigate (daily, [mac-mapped])
    # -------------------------------------------------------------------------

    # [mac-mapped] Super+1/2/3/4 — jump to workspace
    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'

    # Super+Tab / Super+Shift+Tab — next / previous workspace
    # Deferred. cmd-tab / cmd-shift-tab is the macOS app switcher. Do not steal it.
    # Sequential walk can land later on a non-colliding chord (e.g. cmd-ctrl-left/right).
    # cmd-tab = 'workspace next --wrap-around'
    # cmd-shift-tab = 'workspace prev --wrap-around'

    # [mac-mapped] Super+Ctrl+Tab — former workspace / back-and-forth
    cmd-ctrl-tab = 'workspace-back-and-forth'

    # [mac-mapped] Super+Shift+1/2/3/4 — move window to workspace (follow)
    # AeroSpace does not follow by default; --focus-follows-window is the follow flag.
    cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'

    # [mac-mapped] Super+Shift+Alt+1/2/3/4 — move window, do not follow
    # Supported: omit --focus-follows-window (AeroSpace default).
    cmd-shift-alt-1 = 'move-node-to-workspace 1'
    cmd-shift-alt-2 = 'move-node-to-workspace 2'
    cmd-shift-alt-3 = 'move-node-to-workspace 3'
    cmd-shift-alt-4 = 'move-node-to-workspace 4'

    # [mac-mapped] Super+Arrow — focus
    cmd-left = 'focus left'
    cmd-down = 'focus down'
    cmd-up = 'focus up'
    cmd-right = 'focus right'

    # [mac-mapped] Super+Shift+Arrow — move (Omarchy “swap”)
    cmd-shift-left = 'move left'
    cmd-shift-down = 'move down'
    cmd-shift-up = 'move up'
    cmd-shift-right = 'move right'

    # [mac-mapped] Super+Minus / Super+Equal — resize
    cmd-minus = 'resize smart -50'
    cmd-equal = 'resize smart +50'

    # [mac-mapped] Super+Shift+Minus / Super+Shift+Equal — resize on the other axis
    cmd-shift-minus = 'resize smart-opposite -50'
    cmd-shift-equal = 'resize smart-opposite +50'

    # [mac-mapped] Super+T — toggle floating / tiling
    cmd-t = 'layout floating tiling'

    # [mac-mapped] Super+F — fullscreen
    # Collision: cmd-f is Find in most Mac apps. Super map wins for the WM
    # chord; in-app Find stays available via the app menu.
    cmd-f = 'fullscreen'

    # [mac-mapped] Super+Grave — toggle scratchpad
    # Super+S is Omarchy’s other scratchpad chord. cmd-s is Save — do not steal it.
    # --auto-back-and-forth makes Grave a toggle (scratch ↔ previous workspace).
    # Collision: cmd-backtick is macOS “cycle windows of this app”. Super map wins.
    cmd-backtick = 'workspace --auto-back-and-forth scratch'

    # [mac-mapped] Super+Alt+S — move window to scratchpad (leave it there)
    cmd-alt-s = 'move-node-to-workspace scratch'

    # [mac-mapped] Super+W — close window (AeroSpace close, not app Quit)
    cmd-w = 'close'

    # [mac-mapped] Super+Shift+Alt+Arrow — move workspace to a monitor
    cmd-shift-alt-left = 'move-workspace-to-monitor --wrap-around left'
    cmd-shift-alt-down = 'move-workspace-to-monitor --wrap-around down'
    cmd-shift-alt-up = 'move-workspace-to-monitor --wrap-around up'
    cmd-shift-alt-right = 'move-workspace-to-monitor --wrap-around right'

    # -------------------------------------------------------------------------
    # A — deferred (Hyprland-only layouts / grouping)
    # -------------------------------------------------------------------------

    # [deferred] Super+Tab / Super+Shift+Tab — workspace next/prev. See above.
    # [deferred] Super+L — dwindle ↔ scrolling. Not an AeroSpace pair.
    # [deferred] Super+P — dwindle pseudo.
    # [deferred] Super+J — toggle split.
    # [deferred] Super+O — sticky floating pop-out.
    # [deferred] Super+G and Super+Alt+* group chords — Hyprland window groups.
    # [deferred] Super+Alt+F / Super+Ctrl+F — full-width / tiled-fullscreen.

    # -------------------------------------------------------------------------
    # B — Launch (Omakase launcher)
    # -------------------------------------------------------------------------
    #
    # Super+Space is cmd-space. AeroSpace owns the chord while this map
    # is loaded. Spotlight is not rewritten in System Settings. Reclaim:
    # delete cmd-space and reload, or quit AeroSpace. If Spotlight still
    # wins, see config/launcher/README.md (contested-chord fallback).
    # Super+Ctrl+Shift+Space (theme cycle) is a different chord.

    # [mac-mapped] Super+Space — Omakase launcher
    cmd-space = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-launch"'

    # [mac-mapped] Super+Return — Ghostty, else Terminal.app
    cmd-enter = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-launch terminal"'

    # [mac-mapped] Super+Shift+Return — Safari, or browser= in launch.conf
    cmd-shift-enter = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-launch browser"'

    # [mac-mapped] Super+Shift+F — Finder (cmd-shift-f is Find-in-files in some apps)
    cmd-shift-f = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-launch files"'

    # [mac-mapped] Super+Shift+N — TextEdit, or editor= in launch.conf
    cmd-shift-n = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-launch editor"'

    # [mac-mapped] Super+Shift+M — Music.app
    cmd-shift-m = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-launch music"'

    # [mac-mapped] Super+Shift+/ — 1Password if installed; no-op if not
    cmd-shift-slash = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-launch passwords"'

    # [mac-mapped] Super+Escape — lock / sleep / restart picker
    cmd-esc = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-launch system"'

    # -------------------------------------------------------------------------
    # C — Agents & system (scripts in bin/, notes in config/agents/)
    # -------------------------------------------------------------------------

    # [mac-mapped] Super+Shift+Ctrl+A — pick a local coding agent
    cmd-ctrl-shift-a = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-agent pick"'

    # [mac-mapped] Super+Ctrl+Return — primary local agent
    cmd-ctrl-enter = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-agent primary"'

    # [mac-mapped] Super+Ctrl+L — lock screen
    # Script prefers Control+Command+Q; pmset displaysleepnow is the fallback.
    cmd-ctrl-l = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-lock"'

    # [mac-mapped] Super+Ctrl+Shift+Space — cycle Kyoto / Mocha / Ume
    # Paints SketchyBar, JankyBorders, and Ghostty from one shared palette.
    # /bin/bash -lc so $HOME expands when AeroSpace launches from the menu extra.
    cmd-ctrl-shift-space = 'exec-and-forget /bin/bash -lc "$HOME/.config/omakase/bin/omakase-theme cycle"'

    # -------------------------------------------------------------------------
    # C — deferred (Super clipboard, nested app chords)
    # -------------------------------------------------------------------------

    # [deferred] Super+C / Super+X / Super+V — Super clipboard.
    #            Command clipboard stays native. Do not bind cmd-c / cmd-x / cmd-v.
    # [deferred] Super+Ctrl+V — clipboard manager.
    # [deferred] Nested tmux / Neovim / Ghostty / Compose chords. Apps keep them.
